<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>업무분장표 B판</title>
<style>*,*::before,*::after{box-sizing:border-box}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@800&display=swap">
<style>
/* layout: 학교 업무분장표 한 장 — 왼쪽 업무 칸, 오른쪽 담당 도구. 칸을 누르면 도구(또는 대화)로 들어간다 */
:root{
  --paper:#F4F6F9; --sheet:#FFFFFF; --ink:#17202B; --sub:#5A6575; --line:#D3D9E1; --line-strong:#8F9BAA;
  --head:#EDF1F5; --accent:#0A7BD0; --accent-soft:#E3F0FB; --hover:#F3F7FB;
  --bubble-t:#0A7BD0; --bubble-t-ink:#FFFFFF; --bubble-ai:#EDF1F5; --scrim:rgba(15,20,26,.55);
  --band-blue:#0099FF; --band-yellow:#FFCC00; --band-green:#339900; --band-red:#FF3300;
  --f-title:"Nanum Myeongjo","Batang",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1319; --sheet:#151C24; --ink:#E6EBF1; --sub:#98A5B4; --line:#283240; --line-strong:#4A5767;
  --head:#1B2430; --accent:#52B4FF; --accent-soft:#16304A; --hover:#1A2330;
  --bubble-t:#2A7FC4; --bubble-t-ink:#FFFFFF; --bubble-ai:#1F2935; --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1319; --sheet:#151C24; --ink:#E6EBF1; --sub:#98A5B4; --line:#283240; --line-strong:#4A5767;
  --head:#1B2430; --accent:#52B4FF; --accent-soft:#16304A; --hover:#1A2330;
  --bubble-t:#2A7FC4; --bubble-t-ink:#FFFFFF; --bubble-ai:#1F2935; --scrim:rgba(0,0,0,.65); color-scheme:dark}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:clamp(16px,4vw,40px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{max-width:1180px;margin:0 auto;background:var(--sheet);border:1px solid var(--line-strong)}
.band{display:grid;grid-template-columns:3fr 1fr;height:8px}
.band.top span:first-child{background:var(--band-blue)} .band.top span:last-child{background:var(--band-yellow)}
.band.bot span:first-child{background:var(--band-green)} .band.bot span:last-child{background:var(--band-red)}
.head{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;padding:18px clamp(14px,2.5vw,28px) 16px}
.head h1{grid-column:2;margin:0;font-family:var(--f-title);font-weight:800;font-size:clamp(24px,3.4vw,40px);letter-spacing:.06em;text-align:center;text-wrap:balance}
.head .year{font-size:13px;color:var(--sub);letter-spacing:.04em}
.head .who{justify-self:end;font-size:13px;color:var(--sub)}
.head .who b{color:var(--ink);font-weight:600}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border-top:1px solid var(--line);vertical-align:top}
th{width:clamp(96px,14vw,170px);background:var(--head);text-align:left;font-weight:600;font-size:clamp(15px,1.6vw,19px);
  padding:16px clamp(10px,1.6vw,20px);border-right:1px solid var(--line)}
th small{display:block;font-weight:400;font-size:12px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
td{padding:10px}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(132px,15vw,190px),1fr));gap:6px}
.cell{display:flex;align-items:center;gap:8px;min-height:52px;padding:10px 12px;border:1px solid var(--line);background:var(--sheet);
  color:var(--ink);text-decoration:none;font:inherit;font-size:clamp(15px,1.45vw,18px);font-weight:500;text-align:left;cursor:pointer;
  transition:background .15s,border-color .15s;min-width:0}
.cell:hover{background:var(--hover);border-color:var(--line-strong)}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cell .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.cell .go{flex:none;font-size:13px;color:var(--sub)}
.cell.nolink{color:var(--sub);cursor:default;border-style:dashed}
.cell.nolink:hover{background:var(--sheet);border-color:var(--line)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent);opacity:0;transform:scale(.3);transition:opacity .35s,transform .35s}
body.dots .dot.on{opacity:1;transform:scale(1)}
body.dots .cell.stu{background:var(--accent-soft);border-color:var(--accent)}
body.talk .cell{cursor:pointer;border-style:solid;color:var(--ink)}
body.talk .cell.nochat{color:var(--sub)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px clamp(14px,2.5vw,28px);border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
.legend{display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .35s}
body.dots .legend{opacity:1}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.ctrls{display:flex;gap:6px}
.pubnote{font-size:13px;color:var(--sub);flex-basis:100%}
.ctrls button{font:inherit;font-size:13px;color:var(--sub);background:transparent;border:1px solid var(--line);padding:5px 10px;cursor:pointer}
.ctrls button[aria-pressed="true"]{color:var(--ink);border-color:var(--line-strong);background:var(--head)}
.ctrls button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:620px){
  .head{grid-template-columns:1fr;text-align:center}.head h1{grid-column:1}.head .who{justify-self:center}
  table,tbody,tr,th,td{display:block;width:auto}th{border-right:0;padding:10px 12px}
}
/* 대화 화면 */
.chat{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{width:min(760px,100%);max-height:100%;overflow:auto;background:var(--sheet);border:1px solid var(--line-strong)}
.panel .band{height:6px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:20px;font-weight:600}
.ph .cat{font-size:13px;color:var(--sub)}
.ph button{font:inherit;font-size:14px;background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 12px;cursor:pointer}
.msgs{display:flex;flex-direction:column;gap:12px;padding:20px}
.msg{max-width:80%;padding:12px 16px;font-size:clamp(16px,1.6vw,19px);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.t{align-self:flex-end;background:var(--bubble-t);color:var(--bubble-t-ink);border-radius:16px 16px 4px 16px}
.msg.ai{align-self:flex-start;background:var(--bubble-ai);color:var(--ink);border-radius:16px 16px 16px 4px}
.msg .by{display:block;font-size:12px;opacity:.75;margin-bottom:2px}
.empty{padding:28px 20px;color:var(--sub);text-align:center}
.open{display:flex;justify-content:flex-end;padding:0 20px 18px}
.open a{color:var(--accent);font-size:14px}
/* 대화법 */
.techs{display:none;border-top:1px solid var(--line);padding:14px clamp(14px,2.5vw,28px) 16px}
body.talk .techs{display:block}
.techs h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--sub);letter-spacing:.02em}
.techs h3 b{color:var(--ink)}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(200px,22vw,270px),1fr));gap:6px}
.tchip{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:baseline;padding:9px 12px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);
  font:inherit;font-size:15px;font-weight:500;text-align:left;cursor:pointer;min-width:0}
.tchip:hover{background:var(--hover);border-color:var(--line-strong)}
.tchip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tchip .no{color:var(--accent);font-weight:600}
.tchip small{grid-column:2;font-size:12px;font-weight:400;color:var(--sub);line-height:1.45;margin-top:2px}
.cell .go.tn{color:var(--accent);font-size:15px;font-weight:600}
.badge{display:inline-flex;align-items:baseline;gap:8px;margin-top:6px;font-size:15px;font-weight:600;color:var(--accent)}
.badge small{font-size:12px;font-weight:400;color:var(--sub)}
.panel:focus{outline:none}
.msg{animation:pop .28s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.typing .tx{display:none}
.msg .dots3{display:none}
.msg.typing .dots3{display:inline-flex;gap:5px;padding:6px 2px}
.dots3 i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35;animation:blink 1s infinite}
.dots3 i:nth-child(2){animation-delay:.15s}.dots3 i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:1}}
.msg .by em{font-style:normal;margin-left:6px;padding:0 6px;border:1px solid currentColor;border-radius:8px;font-size:11px}
.lesson{margin:4px 20px 18px;padding:14px 16px;border-left:4px solid var(--band-yellow);background:var(--head);animation:pop .35s ease-out both}
.lesson .lh{font-size:13px;color:var(--sub);margin-bottom:2px}
.lesson .lh b{display:block;font-size:clamp(18px,1.9vw,22px);color:var(--ink);font-weight:600;margin-top:2px}
.lesson .say{margin:10px 0;padding:10px 14px;background:var(--sheet);border:1px solid var(--line);font-size:clamp(15px,1.55vw,18px);font-weight:500;line-height:1.55}
.lesson .say small{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-bottom:2px}
.lesson p{margin:0;font-size:clamp(15px,1.5vw,18px);line-height:1.65}
.modes{display:inline-flex;margin-top:10px;border:1px solid var(--line)}
.modes[hidden]{display:none}
.modes button{font:inherit;font-size:13px;padding:5px 12px;background:transparent;color:var(--sub);border:0;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.modes button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pf{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:0 20px 18px}
.pf .src{font-size:12px;color:var(--sub)}
.pf .acts{display:flex;align-items:center;gap:12px;margin-left:auto}
.pf a{color:var(--accent);font-size:14px}
#chatNext{font:inherit;font-size:15px;font-weight:600;background:var(--accent);color:#fff;border:0;padding:8px 16px;cursor:pointer}
#chatNext[hidden],.chat[hidden]{display:none}
.gapline{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px;color:var(--sub);animation:pop .28s ease-out both}
.gapline::before,.gapline::after{content:"";flex:1;border-top:1px dashed var(--line-strong)}
.ph .cat .when{font-weight:600;color:var(--ink)}
#chatNext:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* B 쓰면 열리는 대화 모드 */
.sheet{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cell{-webkit-user-drag:none}
#ink{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none;transition:opacity .6s ease}
body.drawing,body.drawing *{cursor:crosshair!important}
.nm .pv{display:none}
body.talk .cell{align-items:flex-start}
body.talk .nm .pv{display:block;margin-top:3px;font-size:12.5px;font-weight:400;line-height:1.4;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.flip{animation:flip .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s);transform-origin:50% 50%}
@keyframes flip{from{transform:perspective(700px) rotateX(-92deg);opacity:0}to{transform:none;opacity:1}}
.head h1.swap{animation:swap .6s ease both}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.head .who b{cursor:default}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:40;transform:translateX(-50%);
  width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--sheet);padding:12px 18px;font-size:15px;line-height:1.5;
  box-shadow:0 8px 24px rgba(0,0,0,.18);animation:toast .35s ease-out both}
.toast.out{animation:toastout .4s ease-in both}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastout{to{opacity:0;transform:translate(-50%,10px)}}
.cp{display:block;margin:8px 0 0 auto;font:inherit;font-size:12px;line-height:1;padding:6px 10px;border:1px solid currentColor;border-radius:10px;
  background:transparent;color:inherit;cursor:pointer;opacity:.9}
.cp:hover{opacity:1}
.cp:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.lesson .say .cp{color:var(--accent);margin-top:8px}
#btnTalk[hidden]{display:none}
/* ===== 시크릿: AI와 대화하기 예시 — 하얀 무대 한가운데 B, 옆으로 넘기면 B들이 원을 그리며 돈다 =====
   일부러 밝은 단일 테마(두들 그림이 흰 바탕 선화라서). 첫 화면은 가운데 정렬, 장면 화면은 왼쪽 B · 오른쪽 대화창 */
body.sec-on{background:#FFFFFF;color-scheme:light}
.secret{
  --k-ink:#1D1D1F; --k-sub:#6E6E73; --k-faint:#A1A1A6; --k-line:#E3E3E8; --k-wash:#F5F5F7;
  --k-blue:#0071E3; --k-blue-soft:#EAF3FE; --k-blue-ink:#0060C7; --k-red:#E0352B; --k-green:#1F8A3B;
  --k-font:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color-scheme:light;background:#FFFFFF;color:var(--k-ink);font-family:var(--k-font);
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;
  max-width:1240px;margin:0 auto;
}
.secret.flip-in{animation:kin .7s cubic-bezier(.2,.8,.2,1) both}
.secret.flip-out{animation:kout .35s ease-in both}
@keyframes kin{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:none}}
@keyframes kout{to{opacity:0;transform:scale(.98)}}
.flip-stage{perspective:1600px}
.sheet.flip-out{animation:pgout .42s cubic-bezier(.5,0,.75,0) both}
.sheet.flip-back{animation:pgin .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes pgout{to{transform:rotateY(90deg);opacity:.5}}
@keyframes pgin{from{transform:rotateY(-90deg);opacity:.5}to{transform:none;opacity:1}}

/* 위 막대 */
.secret .k-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0 10px;border-bottom:1px solid var(--k-line);font-size:14px}
.secret .k-nav .me{font-weight:700;letter-spacing:-.01em}
.secret .k-nav .me b{display:inline-grid;place-items:center;width:22px;height:22px;margin-left:4px;border:1.5px solid #F08C00;border-radius:50%;font-size:13px}
.secret .k-link{font:inherit;font-size:14px;color:var(--k-blue);background:none;border:0;padding:6px 2px;cursor:pointer}
.secret .k-link:hover{text-decoration:underline}
.secret button:focus-visible,.secret a:focus-visible,.secret .ring:focus-visible{outline:3px solid var(--k-blue);outline-offset:3px;border-radius:8px}

/* 첫 화면 */
.secret .k-hero{text-align:center;padding:clamp(22px,3.6vw,44px) 0 0}
.secret .k-hero h1{margin:0;font-size:clamp(40px,6.4vw,76px);font-weight:800;letter-spacing:-.035em;line-height:1.02;text-wrap:balance}
.secret .k-hero p{margin:14px auto 0;max-width:30em;font-size:clamp(17px,1.7vw,21px);color:var(--k-sub);line-height:1.5}
.secret .ring-wrap{position:relative;margin-top:clamp(8px,2vw,20px);overflow-x:clip}
.secret table{display:table;width:auto}.secret tbody{display:table-row-group}.secret tr{display:table-row}.secret th,.secret td{display:table-cell;width:auto}
.secret .ring{position:relative;height:clamp(280px,34vw,400px);touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.secret .ring.drag{cursor:grabbing}
.secret .ri{position:absolute;left:50%;top:50%;width:clamp(220px,30vw,380px);height:clamp(220px,30vw,380px);padding:0;border:0;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;will-change:transform,opacity,filter;-webkit-tap-highlight-color:transparent}
.secret .ri img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.secret .ri .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:72%;aspect-ratio:1;border-radius:50%;background:var(--k-wash);color:#C7C7CC;font-size:clamp(64px,9vw,120px);font-weight:800;line-height:1;letter-spacing:-.04em}
.secret .ri .ph small{font-size:14px;font-weight:500;letter-spacing:0;color:var(--k-faint)}
.secret .floor{position:absolute;left:50%;bottom:6%;width:min(70%,560px);height:26px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.09),rgba(0,0,0,0));pointer-events:none}
.secret .arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:var(--k-wash);color:var(--k-ink);
  font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:background .2s}
.secret .arrow:hover{background:#E8E8ED}
.secret .arrow.l{left:0}.secret .arrow.r{right:0}
.secret .k-info{text-align:center;padding:0 0 8px}
.secret .k-info h2{margin:0;font-size:clamp(30px,4.2vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.12;white-space:pre-line;min-height:2.24em;display:flex;align-items:center;justify-content:center}
.secret .k-info h2.swap{animation:kswap .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes kswap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.secret .meths{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px auto 0;max-width:720px;min-height:34px}
.secret .meths span{font-size:14px;color:var(--k-blue-ink);background:var(--k-blue-soft);padding:6px 12px;border-radius:999px}
.secret .cta{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font:inherit;font-size:17px;font-weight:600;color:#FFFFFF;background:var(--k-blue);border:0;border-radius:999px;padding:12px 26px;cursor:pointer;transition:background .2s,transform .2s}
.secret .cta:hover{background:#0077ED}
.secret .cta:active{transform:scale(.97)}
.secret .dots{display:flex;justify-content:center;gap:10px;margin:26px 0 0}
.secret .dots button{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:#D2D2D7;cursor:pointer;transition:background .2s,width .3s}
.secret .dots button[aria-current="true"]{background:var(--k-ink);width:22px;border-radius:4px}
.secret .k-common{margin:clamp(36px,6vw,64px) auto 0;padding:22px 0 8px;border-top:1px solid var(--k-line);display:grid;grid-template-columns:repeat(4,1fr);gap:18px;text-align:left}
.secret .k-common div{font-size:15px;line-height:1.5;color:var(--k-sub)}
.secret .k-common b{display:block;color:var(--k-ink);font-size:17px;margin-bottom:4px;letter-spacing:-.01em}
.secret .k-note{margin:18px 0 0;font-size:12px;color:var(--k-faint);text-align:center}
.secret .k-note + .k-note{margin-top:4px}

/* 장면 화면 */
.secret .s-scene{display:grid;grid-template-columns:minmax(260px,40%) 1fr;gap:clamp(18px,3vw,44px);padding:clamp(18px,3vw,34px) 0 10px;align-items:start}
.secret .bside{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px;min-width:0}

const $ = s => document.querySelector(s);
const href = u => /^https?:/.test(u) ? u : BASE + u + (u.endsWith(".html") ? "" : "/");
const link = it => PUBLIC && it.demo ? it.demo : (it.url ? href(it.url) : null);
if (PUBLIC) BOARD.forEach(r => { r.items = r.items.filter(it => it.pub !== false); });
let unlocked = !PUBLIC;
let talk = !PUBLIC && location.hash === "#talk";
let flipNext = false;
let lastFocus = null;
let cur = null; // {it, mode, shown, lessonShown}
const lines = () => cur ? (cur.mode === "real" ? (cur.it.real || []) : cur.it.chat) : [];

function render(){
  const rows = $("#rows");
  rows.textContent = "";
  let flipIdx = 0;
  BOARD.forEach((row, ri) => {
    const tr = document.createElement("tr");
    const th = document.createElement("th");
    th.textContent = row.cat;
    const sm = document.createElement("small");
    sm.textContent = (row.note ? row.note + " · " : "") + row.items.length + "개";
    th.appendChild(sm);
    const td = document.createElement("td");
    const wrap = document.createElement("div");
    wrap.className = "cells";
    row.items.forEach((it, ii) => {
      let el;
      const L = link(it), pubChat = PUBLIC && it.pubNote;
      const hasChat = it.chat.length > 0;
      if ((!talk || !hasChat) && L){
        el = document.createElement("a");
        el.href = L;
        el.target = "_blank"; el.rel = "noopener";
      } else {
        el = document.createElement("button");
        el.type = "button";
        if ((talk && hasChat) || pubChat) el.addEventListener("click", () => openChat(ri, ii, el));
      }
      el.className = "cell" + (it.stu ? " stu" : "") + (!talk && !L && !pubChat ? " nolink" : "") + (talk && !it.chat.length ? " nochat" : "");
      const dot = document.createElement("span"); dot.className = "dot" + (it.stu ? " on" : ""); dot.setAttribute("aria-hidden","true");
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = it.name;
      const first = it.chat.find(m => m.who === "t");
      if (first){ const pv = document.createElement("small"); pv.className = "pv"; pv.textContent = "“" + first.text.split("\n")[0] + "”"; nm.appendChild(pv); }
      const go = document.createElement("span"); go.setAttribute("aria-hidden","true");
      if (talk && it.tech){ go.className = "go tn"; go.textContent = TECH[it.tech].no; el.title = TECH[it.tech].name; }
      else { go.className = "go"; go.textContent = talk ? (hasChat ? "" : (L ? "↗" : "")) : (L ? "↗" : pubChat ? "대화" : ""); }
      el.append(dot, nm, go);
      if (!talk && !L && !pubChat) el.title = "공개 주소 없음";
      if (flipNext){ el.classList.add("flip"); el.style.setProperty("--d", (flipIdx++ * 0.045) + "s"); }
      wrap.appendChild(el);
    });
    td.appendChild(wrap);
    tr.append(th, td);
    rows.appendChild(tr);
  });
  document.body.classList.toggle("talk", talk);
  const bt = $("#btnTalk");
  if (bt){ bt.setAttribute("aria-pressed", String(talk)); bt.textContent = PUBLIC ? "AI와 대화하기 예시" : (talk ? "도구로 보기" : "대화로 보기"); bt.hidden = !unlocked; }
  if (PUBLIC){
    const h = document.querySelector(".head h1"), want = talk ? "AI와 대화하기 예시" : "체육교사 업무분장표";
    if (h.textContent !== want){ h.textContent = want; if (flipNext){ h.classList.remove("swap"); void h.offsetWidth; h.classList.add("swap"); } }
    document.title = want;
  }
  flipNext = false;
}

function renderTechs(){
  const box = $("#techList"); box.textContent = "";
  Object.keys(TECH).forEach(k => {
    const t = TECH[k];
    let at = null;
    BOARD.some((row, ri) => row.items.some((it, ii) => it.name === t.rep && (at = [ri, ii])));
    if (!at) BOARD.some((row, ri) => row.items.some((it, ii) => it.tech == k && (at = [ri, ii])));
    const b = document.createElement("button"); b.type = "button"; b.className = "tchip";
    const no = document.createElement("span"); no.className = "no"; no.textContent = t.no;
    const nm = document.createElement("span"); nm.textContent = t.name;
    const sm = document.createElement("small"); sm.textContent = t.say;
    b.append(no, nm, sm);
    if (at) b.addEventListener("click", () => openChat(at[0], at[1], b));
    box.appendChild(b);
  });
}

function bubble(m){
  if (m.who === "gap"){
    const g = document.createElement("div"); g.className = "gapline"; g.textContent = m.text; return g;
  }
  const d = document.createElement("div"); d.className = "msg " + m.who;
  const by = document.createElement("span"); by.className = "by";
  by.textContent = m.who === "t" ? "체육교사 B" : "AI";
  if (m.ex){ const e = document.createElement("em"); e.textContent = "예시"; by.appendChild(e); }
  const dots = document.createElement("span"); dots.className = "dots3"; dots.innerHTML = "<i></i><i></i><i></i>";
  const tx = document.createElement("span"); tx.className = "tx"; tx.textContent = m.text;
  d.append(by, dots, tx);
  if (m.who === "t" && talk){
    const cp = document.createElement("button"); cp.type = "button"; cp.className = "cp"; cp.textContent = "복사";
    cp.addEventListener("click", e => { e.stopPropagation(); copyText(m.text, cp); });
    d.appendChild(cp);
  }
  return d;
}

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let typingTimer = 0;

function showNext(){
  if (!cur) return;
  const box = $("#chatMsgs");
  // 아직 '입력 중'이면 바로 보여 주기
  const typing = box.querySelector(".msg.typing");
  if (typing){ clearTimeout(typingTimer); typing.classList.remove("typing"); return; }
  const chat = lines();
  if (cur.shown < chat.length){
    const m = chat[cur.shown++];
    const d = bubble(m);
    box.appendChild(d);
    if (m.who === "ai" && !reduce){
      d.classList.add("typing");
      typingTimer = setTimeout(() => { d.classList.remove("typing"); d.scrollIntoView({block:"nearest", behavior:"smooth"}); }, 650);
    }
    d.scrollIntoView({block:"nearest", behavior: reduce ? "auto" : "smooth"});
  } else if ((!PUBLIC || talk) && !cur.lessonShown && cur.it.tech){
    cur.lessonShown = true;
    showLesson();
  }
  updateNext();
}

function showLesson(){
  const t = TECH[cur.it.tech];
  const L = $("#chatLesson"); L.textContent = "";
  const card = document.createElement("div"); card.className = "lesson";
  const lh = document.createElement("div"); lh.className = "lh";
  lh.textContent = cur.mode === "real" ? "그때 이렇게 말했다면" : "이 대화에서 쓴 대화법";
  const nm = document.createElement("b"); nm.textContent = t.no + " " + t.name; lh.appendChild(nm);
  const say = document.createElement("div"); say.className = "say";
  const sl = document.createElement("small"); sl.textContent = "따라 쓸 말"; say.append(sl, t.say);
  const cp = document.createElement("button"); cp.type = "button"; cp.className = "cp"; cp.textContent = "복사";
  cp.addEventListener("click", e => { e.stopPropagation(); copyText(t.say, cp); }); say.appendChild(cp);
  const p = document.createElement("p"); p.textContent = cur.it.tip || t.why;
  card.append(lh, say, p);
  L.appendChild(card);
  card.scrollIntoView({block:"nearest", behavior: reduce ? "auto" : "smooth"});
}

function updateNext(){
  const n = $("#chatNext"), total = lines().length;
  const done = cur.shown >= total && ((PUBLIC && !talk) || cur.lessonShown || !cur.it.tech);
  n.hidden = !total || done;
  n.textContent = cur.shown >= total ? "그래서, 대화법 ▸" : "다음 ▸  " + cur.shown + " / " + total;
}

function openChat(ri, ii, from){
  { const tt = document.querySelector(".toast"); if (tt) tt.remove(); }

// B 손글씨 인식 — $P 점구름 인식기(Vatavu·Anthony·Wobbrock 2012)를 줄여 씀.
// 획 순서·방향·크기·위치와 상관없이 모양만 비교한다. 외부 라이브러리·네트워크 없음.
const BRecog = (() => {
  const N = 32;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function pathLen(p){ let d = 0; for (let i = 1; i < p.length; i++) if (p[i].id === p[i-1].id) d += dist(p[i-1], p[i]); return d; }

  function resample(pts, n){
    const I = pathLen(pts) / (n - 1); if (!(I > 0)) return null;
    let D = 0; const out = [ {x:pts[0].x, y:pts[0].y, id:pts[0].id} ];
    const p = pts.map(q => ({...q}));
    for (let i = 1; i < p.length; i++){
      if (p[i].id !== p[i-1].id) continue;
      const d = dist(p[i-1], p[i]);
      if (D + d >= I && d > 0){
        const t = (I - D) / d;
        const q = { x: p[i-1].x + t * (p[i].x - p[i-1].x), y: p[i-1].y + t * (p[i].y - p[i-1].y), id: p[i].id };
        out.push(q); p.splice(i, 0, q); D = 0;
      } else D += d;
    }
    while (out.length < n){ const l = p[p.length - 1]; out.push({x:l.x, y:l.y, id:l.id}); }
    return out.slice(0, n);
  }

  function normalize(pts){
    const r = resample(pts, N); if (!r) return null;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const q of r){ minX = Math.min(minX, q.x); maxX = Math.max(maxX, q.x); minY = Math.min(minY, q.y); maxY = Math.max(maxY, q.y); }
    const s = Math.max(maxX - minX, maxY - minY) || 1;
    const sc = r.map(q => ({ x: (q.x - minX) / s, y: (q.y - minY) / s, id: q.id }));
    let cx = 0, cy = 0; for (const q of sc){ cx += q.x; cy += q.y; } cx /= N; cy /= N;
    return sc.map(q => ({ x: q.x - cx, y: q.y - cy, id: q.id }));
  }

  function cloudDist(a, b, start){
    const used = new Array(N).fill(false); let sum = 0, i = start;
    do {
      let min = Infinity, idx = -1;
      for (let j = 0; j < N; j++) if (!used[j]){ const d = dist(a[i], b[j]); if (d < min){ min = d; idx = j; } }
      used[idx] = true;
      sum += (1 - ((i - start + N) % N) / N) * min;
      i = (i + 1) % N;
    } while (i !== start);
    return sum;
  }
  function match(a, b){
    const step = Math.floor(Math.pow(N, 0.5)); let m = Infinity;
    for (let i = 0; i < N; i += step) m = Math.min(m, cloudDist(a, b, i), cloudDist(b, a, i));
    return m;
  }

  // ---------- 견본 모양 만들기 ----------
  const arc = (cx, cy, rx, ry, a0, a1, id, k = 14) => Array.from({length: k + 1}, (_, i) => {
    const a = a0 + (a1 - a0) * i / k; return { x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a), id };
  });
  const seg = (x0, y0, x1, y1, id, k = 10) => Array.from({length: k + 1}, (_, i) => ({ x: x0 + (x1 - x0) * i / k, y: y0 + (y1 - y0) * i / k, id }));
  const UP = -Math.PI / 2, DN = Math.PI / 2;
  // 둥근 배: (0,y0)에서 오른쪽으로 불룩했다가 (0,y1)로 돌아옴
  const bump = (y0, y1, w, id) => arc(0, (y0 + y1) / 2, w, (y1 - y0) / 2, UP, DN, id);
  // 각진 배: 가로 → 둥근 모서리 → 가로
  const boxBump = (y0, y1, w, id) => { const r = (y1 - y0) / 2; return [...seg(0, y0, w * 0.45, y0, id, 5), ...arc(w * 0.45, (y0 + y1) / 2, w * 0.55, r, UP, DN, id), ...seg(w * 0.45, y1, 0, y1, id, 5)]; };
  const slant = (p, k) => p.map(q => ({ x: q.x + k * (100 - q.y), y: q.y, id: q.id }));

  function shapeB({ w1 = 45, w2 = 55, mid = 48, box = false, retrace = false, sl = 0, gap = 0 }){
    const bp = box ? boxBump : bump;

    if (retrace) p = [...p, ...seg(0, 100, 0, 0, 0)];

    shapeB({}), shapeB({ w1: 38, w2: 52, mid: 45 }), shapeB({ w1: 50, w2: 50, mid: 50 }), shapeB({ w1: 32, w2: 46, mid: 42 }),
    shapeB({ retrace: true }), shapeB({ box: true }), shapeB({ box: true, retrace: true, w1: 40, w2: 50 }),
    shapeB({ sl: 0.18 }), shapeB({ sl: 0.18, retrace: true, w1: 40 }), shapeB({ w1: 60, w2: 70, mid: 47 }), shapeB({ w1: 28, w2: 34, mid: 46 }),
    shapeB({ gap: 6, w1: 42 }),
  ];
  const NEG = {
    three: [...bump(0, 48, 45, 1), ...bump(48, 100, 55, 2)],
    eight: [...arc(0, 25, 22, 25, 0, Math.PI * 2, 0, 20), ...arc(0, 75, 27, 25, 0, Math.PI * 2, 1, 20)],
    D: [...seg(0, 0, 0, 100, 0), ...bump(0, 100, 60, 1)],
    P: [...seg(0, 0, 0, 100, 0), ...bump(0, 50, 45, 1)],
    R: [...seg(0, 0, 0, 100, 0), ...bump(0, 50, 45, 1), ...seg(0, 50, 50, 100, 2)],
    O: arc(0, 50, 40, 50, 0, Math.PI * 2, 0, 28),
    I: seg(0, 0, 0, 100, 0, 20),
    dash: seg(0, 0, 100, 0, 0, 20),
    slash: seg(0, 100, 70, 0, 0, 20),
    S: [...arc(0, 25, 30, 25, -0.1, -Math.PI * 1.5, 0), ...arc(0, 75, 30, 25, -Math.PI / 2, Math.PI * 0.9, 0)],
    E: [...seg(50, 0, 0, 0, 0), ...seg(0, 0, 0, 100, 0), ...seg(0, 100, 50, 100, 0), ...seg(0, 50, 40, 50, 1)],
    Z: [...seg(0, 0, 60, 0, 0), ...seg(60, 0, 0, 100, 0), ...seg(0, 100, 60, 100, 0)],
    zig: Array.from({ length: 9 }, (_, i) => ({ x: i * 12, y: i % 2 ? 0 : 60, id: 0 })).flatMap((q, i, a) => i ? seg(a[i-1].x, a[i-1].y, q.x, q.y, 0, 4) : []),
    check: [...seg(0, 50, 30, 90, 0), ...seg(30, 90, 90, 0, 0)],
    C: arc(0, 50, 45, 50, -Math.PI * 0.25, -Math.PI * 1.75, 0, 24),
    b: [...seg(0, 0, 0, 100, 0), ...bump(55, 100, 40, 1)],
    m: [...seg(0, 100, 0, 30, 0), ...arc(20, 40, 20, 20, Math.PI, Math.PI * 2, 0), ...seg(40, 40, 40, 100, 0), ...arc(60, 40, 20, 20, Math.PI, Math.PI * 2, 1), ...seg(80, 40, 80, 100, 1)],
    box: [...seg(0, 0, 70, 0, 0), ...seg(70, 0, 70, 100, 0), ...seg(70, 100, 0, 100, 0), ...seg(0, 100, 0, 0, 0)],
    tri: [...seg(0, 100, 40, 0, 0), ...seg(40, 0, 80, 100, 0), ...seg(80, 100, 0, 100, 0)],
    heart: [...arc(25, 25, 25, 25, Math.PI, Math.PI * 2, 0), ...arc(75, 25, 25, 25, Math.PI, Math.PI * 2, 0), ...seg(100, 25, 50, 100, 0), ...seg(50, 100, 0, 25, 0)],
  };
  const TPL = [
    ...POS.map(p => ({ name: "B", pts: normalize(p) })),
    ...Object.entries(NEG).map(([k, p]) => ({ name: k, pts: normalize(p) })),
  ];

  // 너그러움: 숫자가 클수록 대충 그려도 열림
  const LIMIT = 1.55;
  function recognize(strokes){
    const pts = []; strokes.forEach((s, i) => s.forEach(q => pts.push({ x: q.x, y: q.y, id: i })));
    if (pts.length < 8) return { ok: false, why: "short" };
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const q of pts){ minX = Math.min(minX, q.x); maxX = Math.max(maxX, q.x); minY = Math.min(minY, q.y); maxY = Math.max(maxY, q.y); }
    const h = maxY - minY, w = maxX - minX;
    if (h < 24) return { ok: false, why: "small" };          // 너무 작은 낙서·클릭 떨림은 무시
    if (w > h * 1.6 || w < h * 0.12) return { ok: false, why: "ratio" }; // B는 세로가 긴 글자
    const c = normalize(pts); if (!c) return { ok: false, why: "norm" };

    for (const t of TPL){ const d = match(c, t.pts); if (d < bestD){ bestD = d; best = t.name; } if (t.name !== "B") bestNeg = Math.min(bestNeg, d); }
    return { ok: best === "B" && bestD < LIMIT, best, d: +bestD.toFixed(2), neg: +bestNeg.toFixed(2) };
  }
  return { recognize, _shapes: { shapeB, NEG, POS } };
})();

    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();

    ta.remove();
  }
  btn.textContent = ok ? "복사했어요" : "길게 눌러 복사해 주세요";

}

      if (my !== run) return;
      fast = false;
      await beat(b, my);
      if (my !== run) return;
      await sleep(b.hook || b.mark ? 2600 : b.type ? 450 : 900);
    }
    if (my === run) end();
  }

  const down = () => { S.log.scrollTop = S.log.scrollHeight; };
  function say(text, isQ, hook, sub){
    const b = S.bub; b.textContent = "";
    if (!isQ) b.appendChild(h("div", "q0", esc(flat(S.sc.q))));
    if (hook){ b.appendChild(h("div", "hook", esc(hook))); if (sub) b.appendChild(h("div", "sub", esc(sub))); }
    else b.appendChild(h("div", "say", esc(text)));
  }
  async function typeInto(el, text, speed){
    for (let k = 0; k < text.length; k++){
      if (fast){ el.textContent += text.slice(k); break; }
      el.textContent += text[k];
      S.box.scrollTop = S.box.scrollHeight;
      await sleep(speed);
    }
  }
  function segNode(s){
    const seg = h("span", "seg");
    if (s.tag){ seg.appendChild(h("span", "lab", `${NUM[s.n - 1] || s.n} ${esc(s.tag)}`)); seg.appendChild(document.createElement("br")); }
    if (s.file) seg.appendChild(h("span", "file", esc(s.file)));
    if (s.html) seg.insertAdjacentHTML("beforeend", s.html);
    if (s.file || s.html) seg.appendChild(document.createElement("br"));
    return seg;
  }
  async function beat(b, my){
    if (b.say) say(b.say);
    if (b.gap){ S.log.appendChild(h("div", "divider", esc(b.gap))); down(); }
    if (b.fresh){
      S.log.querySelectorAll(".m,.divider").forEach(m => m.classList.add("old"));
      S.log.querySelectorAll(".pen").forEach(p => p.remove());
      S.log.appendChild(h("div", "divider again", "그럼 이렇게 하십시오"));
      say("그럼 이렇게 하십시오.");
      down();
    }
    if (b.type){
      for (const s of b.type){
        if (my !== run) return;
        const seg = segNode(s);
        const txt = h("span", "tx"); seg.appendChild(txt);
        S.box.appendChild(seg);
        if (s.tag){ S.used.push(s); say(`${NUM[s.n - 1]} ${s.tag}`); await sleep(500); }
        await typeInto(txt, s.t, s.tag ? 26 : 45);
      }
    }
    if (b.send){
      S.send.classList.add("go"); await sleep(160); S.send.classList.remove("go");
      const m = h("div", "m t");
      while (S.box.firstChild) m.appendChild(S.box.firstChild);
      S.log.appendChild(m); down();
    }
    if (b.ai){
      const m = h("div", "m ai", '<span class="dots3"><i></i><i></i><i></i></span>');
      S.log.appendChild(m); down();
      await sleep(900);
      if (my !== run) return;
      if (b.ai.html) m.innerHTML = b.ai.html;
      else { m.textContent = ""; await typeInto(m, b.ai.text, 14); }
      down();
      await sleep(300);
    }
    if (b.mark){
      const t = S.log.querySelector("#" + b.mark);
      if (t){ t.scrollIntoView({ block: "center", behavior: fast || reduce ? "auto" : "smooth" }); await sleep(450); pen(t); }
    }
    if (b.hook) say(null, false, b.hook, b.sub);
  }

  function pen(t){
    const L = S.log.getBoundingClientRect(), Rr = t.getBoundingClientRect();
    const pad = 8, w = Rr.width + pad * 2, hgt = Rr.height + pad * 2;
    const x = Rr.left - L.left + S.log.scrollLeft - pad, y = Rr.top - L.top + S.log.scrollTop - pad;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "pen"); svg.setAttribute("width", w); svg.setAttribute("height", hgt);
    svg.style.left = x + "px"; svg.style.top = y + "px";
    const cx = w / 2, cy = hgt / 2, rx = w / 2, ry = hgt / 2;
    let d = "";
    for (let k = 0; k <= 40; k++){
      const a = -2.2 + k / 40 * Math.PI * 2.25, wob = 1 + Math.sin(k * 1.7) * 0.025 + k / 40 * 0.05;
      d += (k ? "L" : "M") + (cx + rx * wob * Math.cos(a)).toFixed(1) + " " + (cy + ry * wob * Math.sin(a)).toFixed(1);
    }
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", d);
    svg.appendChild(p); S.log.appendChild(svg);
    if (!reduce && !fast){
      const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      p.getBoundingClientRect(); p.style.transition = "stroke-dashoffset .7s ease-out"; p.style.strokeDashoffset = 0;
    }
  }

  function end(){
    const sc = S.sc;
    const bar = h("div", "endbar");
    if (S.used.length){
      const meth = h("div", "meth");
      S.used.forEach(s => meth.appendChild(h("span", null, `${NUM[s.n - 1]} ${esc(s.tag)}`)));
      bar.appendChild(meth);
    }
    bar.appendChild(h("div", "first", `<small>이렇게 시작해 보십시오. [ ]만 바꾸면 됩니다.</small>${esc(sc.first)}`));
    if (sc.tips){ const t = h("div", "tips", "<b>더 잘 쓰려면</b>"); const ul = h("ul"); sc.tips.forEach(x => ul.appendChild(h("li", null, esc(x)))); t.appendChild(ul); bar.appendChild(t); }
    const row = h("div", "row");
    const cp = h("button", "primary", "첫 마디 복사"); cp.type = "button";
    cp.addEventListener("click", e => { e.stopPropagation(); copyText(sc.first, cp); setTimeout(() => { cp.textContent = "첫 마디 복사"; }, 1700); });
    const nx = h("button", null, S.i < N - 1 ? "다음 장면" : "처음으로"); nx.type = "button";
    nx.addEventListener("click", e => { e.stopPropagation(); if (S.i < N - 1) play(S.i + 1); else { home(0); window.scrollTo(0, 0); } });
    row.append(cp, nx);
    if (sc.link){ const a = h("a", null, esc(sc.link.text.replace(/\s*↗$/, ""))); a.href = sc.link.href; a.target = "_blank"; a.rel = "noopener"; row.appendChild(a); }
    bar.appendChild(row);
    S.chat.querySelector(".composer").replaceWith(bar);
  }

  document.addEventListener("keydown", e => {
    if (!isOpen || e.target.closest("input,textarea")) return;
    const inScene = !!root.querySelector(".s-scene");
    if (e.key === "Escape"){ if (inScene) home(cur); else close(); }
    else if (inScene && [" ", "ArrowRight", "PageDown", "Enter"].includes(e.key) && !e.target.closest("button,a")){ e.preventDefault(); hurry(); }
    else if (!inScene && R && !e.target.closest(".ring,button,a")){
      if (e.key === "ArrowRight"){ e.preventDefault(); step(1); }
      else if (e.key === "ArrowLeft"){ e.preventDefault(); step(-1); }
    }
  });

  return { open, close, get isOpen(){ return isOpen; } };
})();

if (PUBLIC && /^#b[1-7]?$/.test(location.hash)){ const n = +location.hash.slice(2); unlocked = true; render(); Secret.open(n ? n - 1 : null); }
</script>
