<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 체육교사 AI 연수 자료</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* layout: 연수 자료 목록 한 장 — 연수 당일에 여는 것 / 연수 준비 */
:root{
  --paper:#f5f6f8; --sheet:#ffffff; --ink:#1c1f26; --mute:#5d6472; --line:#dde1e8; --b:#2b56c9; --b-soft:#e7edfb; --mark:#ffd84a;
  --f-disp:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#14161b; --sheet:#1c1f26; --ink:#e9ecf2; --mute:#9aa2b1; --line:#2d323c; --b:#7f9df0; --b-soft:#232c44; --mark:#c9a42a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--f-body);
  padding:max(28px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
.eyebrow{font-size:12.5px;letter-spacing:.08em;color:var(--mute);font-weight:500;margin:0 0 6px}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(32px,6vw,48px);line-height:1.12;margin:0;text-wrap:balance}
h1 .hl{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%)}
h2{font-family:var(--f-disp);font-weight:400;font-size:22px;margin:0 0 12px}
.list{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.item:first-child{border-top:0}
.item:hover{background:var(--b-soft)}
.item:focus-visible{outline:2px solid var(--b);outline-offset:-2px}
.item div{min-width:0}
.item b{display:block;font-size:16px;font-weight:600}
.item span{font-size:14px;color:var(--mute)}
.item code{font-family:var(--f-mono);font-size:12.5px;color:var(--b);white-space:nowrap}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--mute);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:520px){.item{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">2026. AI 체육수업 실천 연구회</p>
    <h1>체육교사 AI 연수 <span class="hl">자료</span></h1>
  </header>

  <section>
    <h2>연수 당일</h2>
    <nav class="list" aria-label="연수 당일 자료">
      <a class="item" href="lecture/"><div><b>학생 상담보다 쉬운 AI 대화</b><span>강의 화면</span></div><code>lecture/</code></a>
      <a class="item" href="board/"><div><b>체육교사 업무분장표</b><span>참가자용 · 칸을 누르면 각 도구로 들어가요</span></div><code>board/</code></a>
      <a class="item" href="okcoding/"><div><b>코딩 몰라도 OK</b><span>우리 학교 체육대회 앱 만들기</span></div><code>okcoding/</code></a>
    </nav>
  </section>

  <section>
    <h2>연수 준비</h2>
    <nav class="list" aria-label="연수 준비 자료">
      <a class="item" href="plan/"><div><b>체육교사 AI 활용 역량 강화 연수 운영 계획(안)</b><span>일정 · 강사 · 운영 방식</span></div><code>plan/</code></a>
    </nav>
  </section>

  <footer><span>연수용 자료입니다. 연수가 끝나면 내립니다.</span><span>2026. 11.</span></footer>
</div>
</body>
</html>
